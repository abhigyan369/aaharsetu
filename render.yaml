# Render Infrastructure-as-Code (Blueprint) Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: food-waste-redistribution-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # Change to your preferred region (e.g. oregon, frankfurt, singapore)
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: food-waste-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EMAILS_ENABLED
        value: "false"

databases:
  - name: food-waste-db
    plan: free
    databaseName: foodwastedb
    user: foodwasteuser
