name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test_secret_key_for_github_actions_ci_testing_only_12345
          DEBUG: true
          EMAILS_ENABLED: false
        run: |
          pytest -v

  deploy:
    name: Trigger Automated Deployment
    needs: test
    # Only deploy when pushing to main or master branch (not on pull requests or feature branches)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository settings."
            echo "Skipping deploy trigger. Please set RENDER_DEPLOY_HOOK_URL in repository secrets."
            exit 0
          fi
          echo "🚀 Triggering automated production deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Deploy hook successfully called!"

