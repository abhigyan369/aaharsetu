# ==============================================================================
# DOCKER COMPOSE — Local Development Orchestration
# ==============================================================================
#
# Services:
#   1. db: PostgreSQL container with named volume persistence & healthcheck.
#   2. app: FastAPI container built from multi-stage Dockerfile, auto-migrating
#      DB with Alembic before starting Uvicorn.
#
# Usage:
#   docker compose up --build         # Start all services (rebuilding app image)
#   docker compose down -v            # Stop services and purge volumes
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: food_waste_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: food_waste_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_waste_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food_waste_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Use service name 'db' as host in DATABASE_URL
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/food_waste_db
      - APP_ENV=development
      - APP_NAME=Food Waste Redistribution Platform
      - DEBUG=true
      - SECRET_KEY=dev_secret_key_for_local_docker_testing_only_change_in_prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - EMAILS_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
    # Automatically apply Alembic migrations before starting the FastAPI app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

# ------------------------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: food_waste_postgres_data
